<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 투표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --ink: #24352f;
  --sub: #596960;
  --line: #dce3de;
  --bg: #f7f8f4;
  --accent: #236b57;
  --accent-d: #19513f;
}

main {
  max-width: 1040px;
  padding: 48px 20px 64px;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--accent);
  font-size: .85rem;
  font-weight: 700;
}

h1 {
  font-size: clamp(1.6rem, 4vw, 2.3rem);
  line-height: 1.4;
  letter-spacing: -.04em;
  margin-bottom: 14px;
}

p.lead {
  line-height: 1.8;
  margin-bottom: 30px;
}

.grid { gap: 22px; }

.photo {
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 4px 16px rgb(36 53 47 / 5%);
  transition: transform .18s, box-shadow .18s, border-color .18s;
}

.photo .cap {
  padding: 16px;
  font-weight: 700;
}

@media (hover: hover) {
  .photo:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgb(36 53 47 / 10%);
  }
}

#v-form { max-width: 720px; margin: auto; }
#v-form > h1 { margin-bottom: 24px; }

.picked {
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 24px;
}

form {
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 8px 28px rgb(36 53 47 / 5%);
}

label.f { margin-bottom: 8px; }

input[type=text], input[type=tel], textarea {
  border-width: 1px;
  border-radius: 10px;
  padding: 14px;
}

input:focus, textarea:focus {
  box-shadow: 0 0 0 3px rgb(35 107 87 / 15%);
}

.consent { padding: 16px; line-height: 1.8; }
.check { align-items: flex-start; }
.check input { flex-shrink: 0; accent-color: var(--accent); }

button.btn { border-radius: 12px; min-height: 52px; }
.row .primary { flex: 1; }
button.ghost { border-color: var(--line); }

.done {
  max-width: 720px;
  margin: auto;
  padding: 48px 24px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
}

@media (max-width: 640px) {
  main { padding: 30px 18px 48px; }
  .grid { gap: 14px; }
  .photo .cap { padding: 12px; }
  form { padding: 20px; }

  .picked { flex-direction: row; align-items: center; }
  .picked .frame { width: 88px; }
  .picked > div:last-child { flex: 1; min-width: 0; }

  .row { flex-direction: column; }
  .row button { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .photo { transition: none; }
  .photo:hover { transform: none; }
}
</style>
</head>
<body>
<main>

  <!-- 1. 사진 선택 -->
  <section id="v-pick">
    <h1>마음에 드는 사진을 눌러 주세요</h1>
    <p class="lead">가장 마음에 드는 사진 한 장을 선택하면 간단한 설문으로 넘어갑니다.</p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 2. 설문 -->
  <section id="v-form" class="hidden">
    <h1>선택하신 사진에 대해 알려 주세요</h1>
    <div class="picked">
      <div class="frame" id="pickedFrame"></div>
      <div><b id="pickedTitle"></b><span class="hint">다른 사진을 고르려면 아래 '다시 고르기'를 눌러 주세요.</span></div>
    </div>
    <form id="form" novalidate>
      <div class="field">
        <label class="f" for="name">성명</label>
        <input type="text" id="name" autocomplete="name" maxlength="30">
      </div>
      <div class="field">
        <label class="f" for="phone">연락처</label>
        <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-0000-0000">
      </div>
      <div class="field">
        <label class="f" for="comment">사진에 대한 소감</label>
        <textarea id="comment" maxlength="1000"></textarea>
      </div>
      <div class="consent">
        <b>개인정보 수집·이용 안내</b><br>
        수집 항목: 성명, 연락처 / 수집 목적: 사진 선호도 조사 결과 정리 및 참여 확인 / 보유 기간: 조사 종료 후 OOO까지<br>
        동의하지 않으실 수 있으며, 동의하지 않으면 참여가 제한됩니다.
      </div>
      <label class="check"><input type="checkbox" id="agree"> 위 내용에 동의합니다.</label>
      <p class="err" id="err" role="alert"></p>
      <div class="row">
        <button type="submit" class="btn primary" id="submit">제출하기</button>
        <button type="button" class="btn ghost" id="back">다시 고르기</button>
      </div>
    </form>
  </section>

  <!-- 3. 완료 -->
  <section id="v-done" class="hidden done">
    <h1>참여해 주셔서 감사합니다</h1>
    <p class="lead">응답이 정상적으로 접수되었습니다.</p>
    <button class="btn primary" id="again">처음으로</button>
  </section>

</main>

<script>
/* ====== 여기만 수정하세요 ====== */
const SCRIPT_URL = "여기에_Apps_Script_웹앱_URL_붙여넣기";
const PHOTOS = [
  { src: "photos/1.jpg", title: "사진 1 변경" },
  { src: "photos/2.jpg", title: "사진 2 변경" },
  { src: "photos/3.jpg", title: "사진 3 변경" },
  { src: "photos/4.jpg", title: "사진 4 변경" },
  { src: "photos/5.jpg", title: "사진 5 변경" },
  { src: "photos/6.jpg", title: "사진 6 변경" }
];
/* =============================== */

const $ = id => document.getElementById(id);
let selected = null;

function thumb(p, i) {
  const img = new Image();
  img.alt = p.title;
  img.src = p.src;
  img.onerror = () => { img.replaceWith(document.createTextNode(i + 1)); };
  return img;
}

PHOTOS.forEach((p, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "photo";
  const f = document.createElement("div"); f.className = "frame"; f.appendChild(thumb(p, i));
  const c = document.createElement("div"); c.className = "cap"; c.textContent = p.title;
  b.append(f, c);
  b.onclick = () => choose(i);
  $("grid").appendChild(b);
});

function show(id) {
  ["v-pick", "v-form", "v-done"].forEach(v => $(v).classList.toggle("hidden", v !== id));
  window.scrollTo(0, 0);
}

function choose(i) {
  selected = i;
  $("pickedFrame").replaceChildren(thumb(PHOTOS[i], i));
  $("pickedTitle").textContent = PHOTOS[i].title;
  $("err").textContent = "";
  show("v-form");
}

$("back").onclick = () => show("v-pick");
$("again").onclick = () => { $("form").reset(); selected = null; show("v-pick"); };

$("phone").addEventListener("input", e => {
  const d = e.target.value.replace(/\D/g, "").slice(0, 11);
  e.target.value = d.length > 7 ? d.replace(/(\d{3})(\d{3,4})(\d{4})/, "$1-$2-$3")
                  : d.length > 3 ? d.replace(/(\d{3})(\d+)/, "$1-$2") : d;
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("name").value.trim(), phone = $("phone").value.trim(), comment = $("comment").value.trim();
  if (!name) return fail("성명을 입력해 주세요.");
  if (!/^01\d-\d{3,4}-\d{4}$/.test(phone)) return fail("연락처를 010-0000-0000 형식으로 입력해 주세요.");
  if (!comment) return fail("사진에 대한 소감을 적어 주세요.");
  if (!$("agree").checked) return fail("개인정보 수집·이용에 동의해 주세요.");
  fail("");
  const btn = $("submit"); btn.disabled = true; btn.textContent = "제출 중...";
  try {
    await fetch(SCRIPT_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ photo: PHOTOS[selected].title, name, phone, comment })
    });
    $("form").reset();
    show("v-done");
  } catch (_) {
    fail("전송하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.");
  } finally {
    btn.disabled = false; btn.textContent = "제출하기";
  }
});

function fail(msg) { $("err").textContent = msg; return false; }
</script>
</body>
</html>
